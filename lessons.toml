# THE manifest. A lesson that is not here does not exist; a lesson here with no
# content file fails the build. That invariant is what makes "every lesson is
# reachable from the landing page" structurally true (DESIGN.md 3.5).
#
# Fields
#   id       stable slug. Also the samples/ and verify/ key. Never reuse.
#   title    page <title> and sidebar text.
#   tier     crawl | walk | run
#   track    py | r | rust | both
#   order    sort key within the tier. Gaps are fine and leave room to insert.
#   file     path under content/, relative. Must exist or the build fails.
#   sibling  id of the same lesson in the other track, if there is one. Drives
#            the header track switcher (DESIGN.md 3.3). Must be symmetric.
#   verify   required | manual | none
#   source   provenance, for the audit trail. Not rendered.

[site]
title = "Getting Started with AstraeaDB"
base_url = "https://astraeadb.github.io/getting-started/"
repo = "https://github.com/AstraeaDB/getting-started"
license = "MIT"
style_guide = "https://github.com/AstraeaDB/getting-started/blob/main/CONTRIBUTING.md"

[[tier]]
name = "crawl"
title = "Crawl"
blurb = "Get a server running and learn the basics. Pick Python or R and stay in it."
outcome = "You can start AstraeaDB, create nodes and edges, run a vector search, and see your graph in a browser."
time = "about 2 hours"
prereqs = "A terminal, and either Python 3.9+ or R 4.3+."

[[tier]]
name = "walk"
title = "Walk"
blurb = "Embeddings, semantic search, and GraphRAG over a real corpus."
outcome = "You can turn a body of text into a knowledge graph and answer questions against it with an LLM grounded in what the graph actually says."
time = "about 4 hours"
prereqs = "Crawl, plus Ollama running locally."

[[tier]]
name = "run"
title = "Run"
blurb = "Investigative work on fraud and cyber graphs, and giving a coding assistant a memory."
outcome = "You can build an investigation graph from raw telemetry, hunt across it with embeddings and time travel, and produce a report where every claim traces back to a node."
time = "about 6 hours"
prereqs = "Walk. One lesson needs Rust."

